[project]
name = "remit"
version = "0.0.1"
description = "A framework for building business systems that people and agents operate through the same commands."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "src/remit/ledger/vendor/pgledger/LICENSE*"]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46",
    "fastapi>=0.120",
    "httpx2>=2.16",
    "iso4217>=1.16.20260101",
    "joserfc>=1.4",
    "psycopg[binary,pool]>=3.2",
    "pycountry>=24.6",
    "pydantic-settings>=2.11",
    "pydantic[email]>=2.12",
    "uvicorn>=0.38",
]

[project.scripts]
remit = "remit.server.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.10",
    "hypothesis>=6.140",
    "openapi-spec-validator>=0.7",
    "pip-audit>=2.9",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Kestrel's own modules, which tests/test_kestrel.py runs, as a customer's code would be.
pythonpath = ["examples/kestrel-animal-health"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF",
    "C4", "PIE", "PT", "PERF", "FURB", "PLR0402",
    "S",  # security
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"checks/**" = ["S101"]
# The local Keycloak's users and client secret, published in deploy/keycloak for testing.
"tests/test_keycloak.py" = ["S101", "S106"]

[tool.coverage.run]
branch = true
source = ["remit"]

[tool.coverage.report]
# A floor, not a target: raise it as gaps are closed, never lower it.
fail_under = 99.0
precision = 1
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src", "tests", "checks", "examples/kestrel-animal-health"]
strict = ["src", "examples/kestrel-animal-health"]
# Kestrel's modules are imported as `kestrel`, from its own folder, as its deployment does.
executionEnvironments = [
  { root = "examples/kestrel-animal-health" },
  { root = "tests", extraPaths = ["examples/kestrel-animal-health"] },
  { root = "." },
]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
