[project]
name = "remit"
version = "0.0.1"
description = "A framework for building business systems that people and agents operate through the same commands."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "src/remit/ledger/vendor/pgledger/LICENSE*"]
requires-python = ">=3.14"
dependencies = ["psycopg[binary,pool]>=3.2", "pydantic>=2.12"]

[dependency-groups]
dev = ["hypothesis>=6.140", "pyright>=1.1.400", "pytest>=8.4", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "checks"]
strict = ["src"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
